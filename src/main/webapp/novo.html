<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Falta</title>
    <link rel="icon" href="images/favicon.jpg">
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        .fullscreen-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #006B3F 0%, #009B4D 100%);
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .title {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 107, 63, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .loading-percentage {
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin-top: 10px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 0;
            flex: 1;
            justify-content: center;
        }

        .form-item {
            margin-bottom: 30px;
        }

        .big-button {
            display: block;
            text-decoration: none;
            background: white;
            color: #009B4D;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .big-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .big-button:active {
            transform: translateY(-2px);
        }

        .big-button-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #006B3F;
        }

        .big-button-primary:hover {
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
        }

        @media (max-width: 768px) {
            .form-item:last-child {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;
                width: 90%;
                max-width: 400px;
            }

            .form-container {
                padding-bottom: 80px;
            }
        }

        .big-input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid white;
            border-radius: 12px;
            background: white;
            box-sizing: border-box;
        }

        .big-textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid white;
            border-radius: 12px;
            background: white;
            box-sizing: border-box;
            min-height: 50px;
            max-height: 70px;
            resize: none;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 28px;
                margin-bottom: 8px;
            }

            .big-button {
                padding: 15px 18px;
                font-size: 20px;
            }

            .big-input, .big-textarea {
                padding: 15px;
                font-size: 20px;
            }

            .form-container {
                gap: 35px;
            }

            .big-textarea {
                min-height: 45px;
                max-height: 60px;
            }

            #fileName {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">A guardar falta...</div>
        <div class="loading-percentage" id="loadingPercentage">0%</div>
    </div>

    <div class="fullscreen-container">
        <h1 class="title">Nova Falta</h1>
        <div style="margin-bottom: 15px; display: flex; justify-content: center;">
            <a href="main" class="big-button" style="padding: 10px 20px; font-size: 16px;">← Voltar às Faltas</a>
        </div>
        <div class="form-container">
            <form name="frmProduto" action="insert" method="post" enctype="multipart/form-data">
                <div class="form-item">
                    <input type="text" name="nome" placeholder="Nome do produto" class="big-input" required>
                </div>
                <div class="form-item">
                    <textarea name="descricao" placeholder="Descrição (opcional)" class="big-textarea" rows="3"></textarea>
                </div>
                <div class="form-item">
                    <input type="file" name="foto" accept="image/*" capture="environment" id="fotoInput" style="display:none;">
                    <button type="button" class="big-button" onclick="document.getElementById('fotoInput').click()">📷 Tirar Foto</button>
                    <span id="fileName" style="color: white; font-size: 20px; text-align: center;"></span>
                </div>
                <div class="form-item">
                    <button type="button" class="big-button" onclick="searchGoogleImages()">🔍 Pesquisar Foto no Google</button>
                </div>
                <div class="form-item">
                    <button type="submit" class="big-button big-button-primary">➕ Adicionar Falta</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal para mostrar imagens -->
    <div id="imageModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000;">
        <div style="width:100%; height:100%; display:flex; flex-direction:column;">
            <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">Pesquisa de Imagens</h2>
                <button onclick="closeModal()" style="background:#d51213; color:white; border:none; padding:15px 25px; font-size:20px; border-radius:10px; cursor:pointer;">✕ Fechar</button>
            </div>
            <div style="flex:1; padding:20px;">
                <iframe id="searchFrame" style="width:100%; height:100%; border:none; border-radius:10px;"></iframe>
            </div>
            <div style="padding:20px; background:white;">
                <p style="margin:0; font-size:16px; color:#666;">1. Clique com botão direito na imagem escolhida</p>
                <p style="margin:5px 0 10px 0; font-size:16px; color:#666;">2. Selecione "Copiar endereço de imagem"</p>
                <input type="text" id="selectedImageUrl" placeholder="Cole a URL da imagem aqui" class="big-input" style="margin:10px 0;">
                <button onclick="useSelectedUrl()" class="big-button" style="width:100%;">Usar esta imagem</button>
            </div>
        </div>
    </div>
    
    <input type="hidden" name="fotoUrl" id="fotoUrlHidden">
    <script>
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                document.getElementById('fileName').textContent = e.target.files[0].name;
            }
        });

        function searchGoogleImages() {
            var nome = document.querySelector('input[name="nome"]').value;
            if (nome.trim() !== "") {
                document.getElementById('imageModal').style.display = 'block';
                document.getElementById('searchFrame').src = 'https://www.bing.com/images/search?q=' + encodeURIComponent(nome);
            } else {
                alert("Por favor, preencha o nome do produto primeiro");
            }
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('searchFrame').src = '';
        }

        function useSelectedUrl() {
            var url = document.getElementById('selectedImageUrl').value;
            if (url.trim() !== "") {
                document.getElementById('fotoUrlHidden').value = url;
                document.getElementById('fileName').textContent = 'Imagem selecionada da internet';
                closeModal();
            } else {
                alert("Por favor, cole uma URL de imagem primeiro");
            }
        }

        // Handle form submission with loading animation
        document.querySelector('form').addEventListener('submit', function(e) {
            var loadingOverlay = document.getElementById('loadingOverlay');
            var loadingPercentage = document.getElementById('loadingPercentage');
            var percentage = 0;

            loadingOverlay.classList.add('active');

            // Simulate loading percentage
            var interval = setInterval(function() {
                percentage += Math.floor(Math.random() * 15) + 5;
                if (percentage >= 100) {
                    percentage = 100;
                    clearInterval(interval);
                }
                loadingPercentage.textContent = percentage + '%';
            }, 200);
        });
    </script>
</body>
</html>
